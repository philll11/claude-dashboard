[graph]
all-features = true
# The targets claude-dashboard ships for: the release's, and the glibc builds the VS Code
# extension bundles. Dependencies that only other targets use, such as Android's, never ship.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# The licences a dependency may have, whether or not one has it yet.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
  { crate = "windows-sys@0.52.0", reason = "ring 0.17, the TLS cryptography of the usage endpoint, depends on this older version" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
