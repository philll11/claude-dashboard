[graph]
all-features = true
# The targets claude-dashboard ships for: the command line's, and the desktop app's, which on Linux
# is built for glibc. Dependencies that only other targets use, such as Android's, never ship.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, unmaintained, runs only at build time, for the GTK 3 bindings that Tauri 2 uses on Linux; nothing maintained replaces them in Tauri 2" },
  { id = "RUSTSEC-2026-0367", reason = "zip before 9 keeps SUID and SGID bits when it extracts; zip comes through tauri-plugin-updater, whose newest release still needs zip 4, and the updater unzips only on Windows, only an update whose signature it has checked against the app's public key" },
  { id = "RUSTSEC-2026-0368", reason = "zip before 9 creates symbolic links that point outside the folder it extracts to; zip comes through tauri-plugin-updater, whose newest release still needs zip 4, and the updater unzips only on Windows, only an update whose signature it has checked against the app's public key" },
  { id = "RUSTSEC-2026-0369", reason = "zip before 9 applies Unix permissions through symbolic links when it extracts; zip comes through tauri-plugin-updater, whose newest release still needs zip 4, and the updater unzips only on Windows, only an update whose signature it has checked against the app's public key" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant, unmaintained as a crate of its own since zbus took it in; tauri-plugin-opener and tauri-plugin-single-instance use zbus 5 on Linux, and none of their releases moves past it" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names, unmaintained as a crate of its own since zbus took it in; tauri-plugin-opener and tauri-plugin-single-instance use zbus 5 on Linux, and none of their releases moves past it" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, unmaintained as a crate of its own since zbus took it in; tauri-plugin-opener and tauri-plugin-single-instance use zbus 5 on Linux, and none of their releases moves past it" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The licences a dependency may have, whether or not one has it yet.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
  { crate = "windows-sys@0.52.0", reason = "ring 0.17, the TLS cryptography of the usage endpoint, depends on this older version" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
