[package]
name = "claude-dashboard-desktop"
description = "The desktop app of claude-dashboard: the dashboard in a window of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
auto-launch = "0.6.0"
claude-dashboard-core = { path = "../../../crates/core" }
claude-dashboard-server = { path = "../../../crates/server" }
jiff = "0.2.37"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.0"
tauri-plugin-log = "2.10.0"
tauri-plugin-opener = "2.6.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-updater = "2.13.0"
tauri-plugin-window-state = "2.5.0"

[dev-dependencies]
insta = { version = "1.48.0", default-features = false }
tempfile = "3.27.0"

[lints]
workspace = true

# The desktop app's installers come from .github/workflows/desktop-release.yml, not from dist.
[package.metadata.dist]
dist = false
