          - rowheader /Haiku 5\.5, prompts up to [\d,.]+[bkmBKM]+/
          - cell /\$\d+\.\d+/
          - cell /\$\d+\.\d+/
          - cell /\$\d+\.\d+/
          - cell /\$\d+\.\d+/
          - cell /\$\d+\.\d+/
        - row /Haiku 5\.5, longer prompts \$\d+\.\d+ \$\d+\.\d+ \$\d+\.\d+ \$\d+\.\d+ \$\d+\.\d+/:
          - rowheader "Haiku 5.5, longer prompts"
