          - columnheader "Cache write, 5 min"
          - columnheader "Cache write, 1 h"
          - columnheader "Cache read"
      - rowgroup:
        - row /Opus 5\.5 \$\d+\.\d+ \$\d+\.\d+ \$\d+\.\d+ \$\d+\.\d+ \$\d+\.\d+/:
          - rowheader "Opus 5.5"
          - cell /\$\d+\.\d+/
