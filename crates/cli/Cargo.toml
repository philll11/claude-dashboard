[package]
name = "claude-dashboard"
description = "See how you use Claude Code: plan limits, usage, API-equivalent cost and where it goes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anstyle-query = "1.1.5"
clap = { version = "4.6.7", features = ["derive"] }
claude-dashboard-core = { path = "../core" }
claude-dashboard-server = { path = "../server" }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
jiff = "0.2.37"
lsp-server = "0.10.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
terminal-colorsaurus = "1.0.3"
unicode-width = "0.2.0"

[target.'cfg(unix)'.dependencies]
# ratatui's crossterm, reading the terminal through its level-triggered event source: the default
# one can leave a key unread until the next one when the key and a resize arrive together, and
# lose the resize when the key comes first.
crossterm = { version = "0.29.0", default-features = false, features = ["use-dev-tty"] }
signal-hook = { version = "0.4.5", default-features = false, features = ["iterator"] }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.48.0", default-features = false }
portable-pty = "0.9.0"
predicates = "3.1.4"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
tempfile = "3.27.0"
vt100 = "0.18.1"
