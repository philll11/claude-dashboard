[package]
name = "claude-dashboard"
description = "See how you use Claude Code: plan limits, usage, API-equivalent cost and where it goes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anstyle-query = "1.1.5"
clap = { version = "4.6.7", features = ["derive"] }
claude-dashboard-core = { version = "0.0.0", path = "../core" }
jiff = "0.2.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
tempfile = "3.27.0"
