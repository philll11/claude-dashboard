[package]
name = "claude-dashboard-core"
description = "Reads Claude Code's local data and keeps the usage history behind claude-dashboard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
dirs = "7.0.0"
jiff = { version = "0.2.37", features = ["serde"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier", "win-system-proxy"] }
walkdir = "2.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11.0"
tempfile = "3.27.0"

[[bench]]
name = "core"
harness = false

[lints]
workspace = true
