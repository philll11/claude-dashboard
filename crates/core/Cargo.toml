[package]
name = "claude-dashboard-core"
description = "Reads Claude Code's local data and keeps the usage history behind claude-dashboard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
dirs = "7.0.0"
jiff = { version = "0.2.37", features = ["serde"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
walkdir = "2.5.0"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"

[lints]
workspace = true
