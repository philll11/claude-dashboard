# Configuration for dist: https://axodotdev.github.io/cargo-dist/book/
# .github/workflows/release.yml is generated from this file. Run `dist generate --mode ci` after changing it;
# the release workflow's plan job fails on any pull request where the two differ.
# Use the dist version named by cargo-dist-version; its releases are at https://github.com/axodotdev/cargo-dist/releases.

[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = ["shell", "powershell"]
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]
# The crates set publish = false, which hides them from dist unless dist = true. A binary crate
# that dist leaves alone, as the desktop app's, sets dist = false in its own manifest.
dist = true
# Build only the packages the release holds: the desktop app's crate does not build for musl.
precise-builds = true
install-path = "CARGO_HOME"
install-updater = false
# Pull requests build the programs' artefacts without publishing, so each one proves the release still builds.
pr-run-mode = "upload"
github-attestations = true
# Attest only when publishing: pull request builds are never published, and Dependabot pull requests cannot write attestations.
github-attestations-phase = "host"
github-release = "host"
# A release goes public only when it is complete (docs/adr/0012-releases-go-public-complete.md):
# - its GitHub Release starts as a draft, with the notes dist plans (.github/workflows/release-draft.yml);
# - once the programs are built, the VS Code extension is packaged with them (.github/workflows/vscode-release.yml)
#   and the desktop app built around them (.github/workflows/desktop-release.yml), and both attach their files to the draft;
# - dist's host job then attaches the programs and publishes the draft, which it does only if every job before it succeeded.
create-release = false
local-artifacts-jobs = ["./release-draft"]
global-artifacts-jobs = ["./vscode-release", "./desktop-release"]
# Once a release is published: install its programs on every operating system and run them (.github/workflows/install-check.yml),
# and install its desktop app and VS Code packages and run their end-to-end tests (.github/workflows/release-check.yml).
post-announce-jobs = ["./install-check", "./release-check"]
github-custom-job-permissions = { "release-draft" = { contents = "write" }, "vscode-release" = { attestations = "write", contents = "write", id-token = "write" }, "desktop-release" = { attestations = "write", contents = "write", id-token = "write" }, "release-check" = { attestations = "read", contents = "read" } }
# Release builds start from a clean target directory.
cache-builds = false

# The runners match the test matrix in .github/workflows/ci.yml.
# Set every one explicitly: dist's defaults are older images.
[dist.github-custom-runners]
global = "ubuntu-24.04"
x86_64-pc-windows-msvc = "windows-latest"
aarch64-pc-windows-msvc = "windows-11-arm"
x86_64-apple-darwin = "macos-15-intel"
aarch64-apple-darwin = "macos-latest"
x86_64-unknown-linux-musl = "ubuntu-24.04"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"

# Every action in the workflow is pinned to a commit; the comment names the release it points at.
# dist writes only the commit into the workflow. Dependabot skips these four actions (see .github/dependabot.yml),
# so update them here when upgrading dist; .github/workflows/ci.yml and vscode-release.yml use the same commits of these.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
