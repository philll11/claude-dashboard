packages:
  - web/*
  - apps/*

# Install only versions published at least two weeks ago, dependencies of dependencies included.
minimumReleaseAge: 20160

# No dependency runs install scripts. esbuild's API works from its platform package without one;
# keytar and vsce-sign serve vsce's token storage and signing, which packaging does not use.
allowBuilds:
  "@vscode/vsce-sign": false
  esbuild: false
  keytar: false

# Every package's Node typings follow Node 24, which every script and test runs on, including those
# a dependency asks for at any version.
overrides:
  "@types/node": 24.19.0
