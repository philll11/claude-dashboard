version: 2

# One weekly pull request for every ecosystem: main takes a pull request only once it is up to date,
# so each one more would wait for another rebase and another run of CI.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: cargo
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    # pnpm-workspace.yaml holds back versions newer than two weeks; Dependabot waits as long.
    cooldown:
      default-days: 14
    ignore:
      # typescript-eslint supports TypeScript below 6.1; raise this once it supports more.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # vsce refuses typings newer than engines.vscode in apps/vscode/package.json; raise both together.
      - dependency-name: "@types/vscode"
        versions: [">=1.127.0"]
      # The typings follow Node 24, which the scripts and tests run on.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    # dist generates release.yml and pins these actions in dist-workspace.toml; update them there with `dist generate`.
    ignore:
      - dependency-name: actions/checkout
      - dependency-name: actions/upload-artifact
      - dependency-name: actions/download-artifact
      - dependency-name: actions/attest
