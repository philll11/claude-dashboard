name: Install check

# Installs a published release the way its notes say, on every operating system and architecture
# it supports, and runs it against a made-up Claude Code folder. The release workflow calls this
# once the release is published (dist's post-announce-jobs); it also runs by hand for any tag.
on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan for the release, as JSON.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to install, such as v0.1.0-alpha.1.
        required: true
        type: string

permissions:
  contents: read

jobs:
  install:
    name: Install (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-24.04 }
          - { name: Linux arm64, os: ubuntu-24.04-arm }
          - { name: Windows x64, os: windows-latest }
          - { name: Windows arm64, os: windows-11-arm }
          - { name: macOS arm64, os: macos-latest }
          - { name: macOS x64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    steps:
      # The tag reaches the shell only through the environment, never inside a script.
      # GitHub reads a step's env before its if, so a run by hand reads an empty plan, not none.
      - name: Choose the release from dist's plan
        if: inputs.plan != ''
        shell: bash
        env:
          PLANNED_TAG: ${{ fromJson(inputs.plan || '{}').announcement_tag }}
        run: echo "TAG=$PLANNED_TAG" >> "$GITHUB_ENV"
      - name: Choose the release asked for
        if: inputs.tag != ''
        shell: bash
        env:
          ASKED_TAG: ${{ inputs.tag }}
        run: echo "TAG=$ASKED_TAG" >> "$GITHUB_ENV"

      - name: Install with the shell installer
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          curl --proto '=https' --tlsv1.2 -LsSf
          "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/claude-dashboard-installer.sh"
          | sh
      - name: Install with the PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/claude-dashboard-installer.ps1" | iex

      - name: Run it on a made-up Claude Code folder
        shell: bash
        run: |
          set -euo pipefail
          home="${CARGO_HOME:-$HOME/.cargo}"
          if command -v cygpath > /dev/null; then home="$(cygpath -u "$home")"; fi
          bin="$home/bin/claude-dashboard"

          "$bin" --version | tee version.txt
          grep -qx "claude-dashboard ${TAG#v}" version.txt

          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-config"
          export CLAUDE_DASHBOARD_HISTORY="$RUNNER_TEMP/history.sqlite"
          export NO_COLOR=1 TZ=UTC
          project="$CLAUDE_CONFIG_DIR/projects/C--code-app"
          mkdir -p "$project"
          now="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          printf '%s\n' "{\"type\":\"assistant\",\"uuid\":\"rec-1\",\"requestId\":\"req_1\",\"timestamp\":\"$now\",\"cwd\":\"/code/app\",\"message\":{\"id\":\"msg_1\",\"model\":\"claude-opus-5-5\",\"usage\":{\"input_tokens\":3,\"output_tokens\":640,\"cache_read_input_tokens\":42000,\"cache_creation_input_tokens\":1500}}}" \
            > "$project/4f1c2a3b-0000-4000-8000-000000000001.jsonl"

          "$bin" doctor
          "$bin" today | tee today.txt
          grep -q "Opus 5.5" today.txt
          "$bin" daily --json | tee daily.json
          grep -Eq '"output": ?640' daily.json
          # An export saved for a spreadsheet starts with UTF-8's byte order mark. macOS's od spaces
          # the bytes wider than GNU's, so the spaces go before comparing.
          "$bin" export --csv --output "$RUNNER_TEMP/requests.csv"
          [ "$(head -c 3 "$RUNNER_TEMP/requests.csv" | od -An -tx1 | tr -d ' \n')" = efbbbf ]
          grep -q "claude-opus-5-5" "$RUNNER_TEMP/requests.csv"
          printf '%s' '{"model":{"id":"claude-opus-5-5","display_name":"Opus"},"rate_limits":{"five_hour":{"used_percentage":42,"resets_at":1999999999}}}' \
            | "$bin" statusline | tee line.txt
          grep -q "5h 42%" line.txt

          # From 1.1.0 the installers also put cld, the program's short name, beside it. Connecting
          # Claude Code's status line through it writes claude-dashboard, as the full name does.
          if printf '%s\n' 1.1.0 "${TAG#v}" | sort -V -C; then
            "$home/bin/cld" --version | tee short.txt
            grep -qx "claude-dashboard ${TAG#v}" short.txt
            "$home/bin/cld" statusline connect --yes
            grep -Eq '"command": ?"([^"]*/)?claude-dashboard(\.exe)? statusline"' "$CLAUDE_CONFIG_DIR/settings.json"
            "$home/bin/cld" statusline connect --yes | tee again.txt
            grep -q "already connected" again.txt
          fi

          # The terminal UI of the build people install on Linux, the musl one, in a pseudo-terminal
          # that script gives it: it draws the Overview with the request's model, q ends it, and it
          # leaves the alternate screen. It writes only the cells that change, so the words of a
          # line can arrive apart, and each is looked for on its own.
          if [ "$RUNNER_OS" = Linux ]; then
            export TERM=xterm-256color CLAUDE_DASHBOARD_THEME=dark
            (sleep 5; printf q) \
              | script --quiet --flush --return --command "stty cols 120 rows 36; exec \"$bin\"" /dev/null \
              > interface.txt
            grep -q "Overview" interface.txt
            grep -q "Opus" interface.txt
            grep -qF $'\e[?1049l' interface.txt
          fi
