name: VS Code release

# Packages the VS Code extension for each platform with the programs of a published release, and
# attaches the packages to the release. The release workflow calls this once the release is
# published (dist's post-announce-jobs); it can also run by hand for a tag.
on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan for the release, as JSON.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to package, such as v0.1.1.
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: write
    steps:
      # The tag reaches the shell only through the environment, never inside a script.
      - name: Choose the release from dist's plan
        if: inputs.plan != ''
        env:
          PLANNED_TAG: ${{ fromJson(inputs.plan).announcement_tag }}
        run: echo "TAG=$PLANNED_TAG" >> "$GITHUB_ENV"
      - name: Choose the release asked for
        if: inputs.tag != ''
        env:
          ASKED_TAG: ${{ inputs.tag }}
        run: echo "TAG=$ASKED_TAG" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Check the extension's version
        run: |
          set -euo pipefail
          version="${TAG#v}"
          test "$(jq -r .version apps/vscode/package.json)" = "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Download the release's programs, as the release built and attested them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release
          cd release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'claude-dashboard-*.zip' --pattern 'claude-dashboard-*.tar.xz' --pattern sha256.sum
          sha256sum --check --ignore-missing sha256.sum
          for archive in claude-dashboard-*.zip claude-dashboard-*.tar.xz; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          done
      - name: Package for each platform, and for the rest
        run: |
          set -euo pipefail
          package() {
            local target="$1" rust="$2" program
            mkdir -p "programs/$rust"
            if [ -f "release/claude-dashboard-$rust.zip" ]; then
              unzip -o -q "release/claude-dashboard-$rust.zip" claude-dashboard.exe -d "programs/$rust"
              program="programs/$rust/claude-dashboard.exe"
            else
              tar -xJf "release/claude-dashboard-$rust.tar.xz" -C "programs/$rust" --strip-components 1 \
                "claude-dashboard-$rust/claude-dashboard"
              program="programs/$rust/claude-dashboard"
            fi
            node apps/vscode/scripts/package.mjs --target "$target" --program "$program" \
              --out "packages/claude-dashboard-$target-$VERSION.vsix"
          }
          mkdir packages
          package win32-x64 x86_64-pc-windows-msvc
          package win32-arm64 aarch64-pc-windows-msvc
          package darwin-x64 x86_64-apple-darwin
          package darwin-arm64 aarch64-apple-darwin
          # The static musl programs run on glibc Linux and on Alpine alike.
          package linux-x64 x86_64-unknown-linux-musl
          package linux-arm64 aarch64-unknown-linux-musl
          package alpine-x64 x86_64-unknown-linux-musl
          package alpine-arm64 aarch64-unknown-linux-musl
          node apps/vscode/scripts/package.mjs --out "packages/claude-dashboard-$VERSION.vsix"
      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" packages/*.vsix --repo "$GITHUB_REPOSITORY" --clobber
