name: VS Code release

# Packages the VS Code extension for each platform with the programs of the release being made, and
# attaches the packages to the release's draft. The release workflow calls this as one of dist's
# global-artifacts-jobs, once the programs are built, and dist's host job publishes the release
# only if this succeeds (docs/adr/0012-releases-go-public-complete.md). On a pull request it
# packages nothing: CI's VS Code jobs package and test every pull request.
on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan for the release, as JSON.
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      # The tag reaches the shell only through the environment, never inside a script.
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the extension's version
        run: |
          set -euo pipefail
          version="${TAG#v}"
          test "$(jq -r .version apps/vscode/package.json)" = "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The programs as this run built them for the release. dist attests them as it publishes the
      # release, and the release check verifies that (.github/workflows/release-check.yml).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-local-*
          path: release
          merge-multiple: true
      - name: Check the programs against their checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum --check claude-dashboard-*.sha256
      - name: Package for each platform, and for the rest
        run: |
          set -euo pipefail
          package() {
            local target="$1" rust="$2" program
            mkdir -p "programs/$rust"
            if [ -f "release/claude-dashboard-$rust.zip" ]; then
              unzip -o -q "release/claude-dashboard-$rust.zip" claude-dashboard.exe -d "programs/$rust"
              program="programs/$rust/claude-dashboard.exe"
            else
              tar -xJf "release/claude-dashboard-$rust.tar.xz" -C "programs/$rust" --strip-components 1 \
                "claude-dashboard-$rust/claude-dashboard"
              program="programs/$rust/claude-dashboard"
            fi
            node apps/vscode/scripts/package.mjs --target "$target" --program "$program" \
              --out "packages/claude-dashboard-$target-$VERSION.vsix"
          }
          mkdir packages
          package win32-x64 x86_64-pc-windows-msvc
          package win32-arm64 aarch64-pc-windows-msvc
          package darwin-x64 x86_64-apple-darwin
          package darwin-arm64 aarch64-apple-darwin
          # The static musl programs run on glibc Linux and on Alpine alike.
          package linux-x64 x86_64-unknown-linux-musl
          package linux-arm64 aarch64-unknown-linux-musl
          package alpine-x64 x86_64-unknown-linux-musl
          package alpine-arm64 aarch64-unknown-linux-musl
          node apps/vscode/scripts/package.mjs --out "packages/claude-dashboard-$VERSION.vsix"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packages/*.vsix
      - name: Attach the packages to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" packages/*.vsix --repo "$GITHUB_REPOSITORY" --clobber
