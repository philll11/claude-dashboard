name: Release channel

# Marks a release with an odd minor version, such as 0.1.1, as a pre-release on GitHub, as the
# Visual Studio Marketplace does for the VS Code extension of the same version; even minor
# versions, such as 0.2.0, are releases. dist marks a release a pre-release only for a version
# with a suffix, such as 0.1.0-alpha.1, so the release workflow calls this once the release is
# published (dist's post-announce-jobs).
on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan for the release, as JSON.
        required: true
        type: string

permissions:
  contents: read

jobs:
  channel:
    name: Mark odd minor versions as pre-releases
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The tag reaches the shell only through the environment, never inside a script.
      - shell: bash
        env:
          TAG: ${{ fromJson(inputs.plan).announcement_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          minor="$(echo "${TAG#v}" | cut -d. -f2)"
          if [ $((minor % 2)) -eq 1 ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false
          fi
