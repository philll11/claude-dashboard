name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep in step with rust-toolchain.toml.
  RUST_TOOLCHAIN: 1.99.0

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-24.04 }
          - { name: Linux arm64, os: ubuntu-24.04-arm }
          - { name: Windows x64, os: windows-latest }
          - { name: Windows arm64, os: windows-11-arm }
          - { name: macOS arm64, os: macos-latest }
          - { name: macOS x64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Runs each benchmark once, so that they keep working; timings come from a quiet machine.
      - run: cargo test --workspace --benches --locked
      - run: cargo run --locked -p claude-dashboard -- --version

  dependencies:
    name: Dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: ${{ env.RUST_TOOLCHAIN }}

  server:
    name: Server for the web tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The server's unit tests write the TypeScript types; the web UI must use the ones the Rust
      # types generate.
      - run: cargo test --locked -p claude-dashboard --bin claude-dashboard
      - run: git diff --exit-code -- web/protocol/src/generated
      - run: cargo build --locked -p claude-dashboard
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-linux-x64
          path: target/debug/claude-dashboard
          retention-days: 1

  web:
    name: Web
    needs: server
    runs-on: ubuntu-24.04
    # The image the screenshot baselines are made in, so that fonts and rendering match.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check-licences
      - run: pnpm build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-linux-x64
          path: server
      - run: chmod +x server/claude-dashboard
      - run: pnpm --filter @claude-dashboard/app exec playwright test
        env:
          CLAUDE_DASHBOARD_BIN: ${{ github.workspace }}/server/claude-dashboard
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/app/playwright-report
            web/app/test-results
          retention-days: 7

  extension:
    name: VS Code (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-24.04, target: linux-x64 }
          - { name: Windows x64, os: windows-latest, target: win32-x64 }
          - { name: macOS arm64, os: macos-latest, target: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # VS Code needs a display, which xvfb-run gives it on Linux.
      WITH_DISPLAY: ${{ startsWith(matrix.os, 'ubuntu') && 'xvfb-run -a' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked -p claude-dashboard
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Integration tests on the oldest VS Code the extension supports
        run: $WITH_DISPLAY pnpm --filter claude-dashboard test:integration
        env:
          VSCODE_VERSION: 1.126.0
      - name: Integration tests on the latest VS Code
        run: $WITH_DISPLAY pnpm --filter claude-dashboard test:integration
        env:
          VSCODE_VERSION: stable
      - name: Package for this platform
        run: >-
          node apps/vscode/scripts/package.mjs --target ${{ matrix.target }}
          --program target/debug/claude-dashboard${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
          --out apps/vscode/claude-dashboard.vsix
      - name: End-to-end tests on the package
        run: $WITH_DISPLAY node apps/vscode/scripts/e2e.mjs --vsix apps/vscode/claude-dashboard.vsix
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-screenshots-${{ matrix.target }}
          path: apps/vscode/test-resources/screenshots
          if-no-files-found: ignore
          retention-days: 7
